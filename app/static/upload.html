<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投稿 · 張崑崙書院</title>
<style>
  :root{
    --red:#88070f; --ink:#241f20; --dim:#6f6864; --line:#e4ddd8; --bg:#faf7f5;
    --card:#fff; --ok:#1c7c54; --warn:#a86400; --err:#a11b1b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif}
  header{background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  header b{font-size:16px;letter-spacing:.5px}
  header .sp{flex:1}
  .lang{display:flex;gap:4px}
  .lang button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;
               border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--red);border-color:#fff;font-weight:600}
  main{max-width:760px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--dim);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  label{display:block;font-size:12.5px;color:var(--dim);margin:10px 0 4px}
  input[type=text],input[type=email],textarea,select{width:100%;border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font:inherit;background:#fff}
  textarea{min-height:76px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.row{grid-template-columns:1fr}}
  .drop{border:2px dashed #d8cbc4;border-radius:10px;padding:22px;text-align:center;color:var(--dim);
        background:#fdfbfa;cursor:pointer;transition:.15s}
  .drop.hot{border-color:var(--red);background:#fff4f3;color:var(--red)}
  .drop b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
  .files{margin-top:10px;font-size:13px}
  .files .f{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);
            border-radius:8px;margin-top:6px;background:#fff}
  .files .f span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .files .f i{color:var(--dim);font-style:normal;font-size:12px}
  .files .f button{border:0;background:transparent;color:var(--err);cursor:pointer;font-size:12px}
  .hint{font-size:12px;color:var(--dim)}
  .chk{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:13px}
  .chk input{margin-top:3px}
  .btn{width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:15px;
       font-weight:600;padding:12px;margin-top:16px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:8px;display:none}
  .msg.ok{display:block;background:#f0f8f3;color:var(--ok);border:1px solid #cde6d8}
  .msg.err{display:block;background:#fff4f4;color:var(--err);border:1px solid #eccaca}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:18px}
  /* 提交成功：卡片升起 + 打勾描边 */
  .done{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;
        padding:34px 26px 28px;text-align:center;box-shadow:0 14px 34px rgba(136,7,15,.10)}
  .done.show{display:block;animation:rise .45s cubic-bezier(.2,.8,.25,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
  .done h2{margin:10px 0 4px;font-size:22px;color:var(--ok)}
  .done .ref{margin:0;color:var(--dim);font-size:14px}
  .done .ref b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
  .doneNote{color:var(--dim);font-size:13px;margin:10px 0 18px}
  .doneBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .doneBtns .btn{width:auto;padding:10px 18px;margin:0;text-decoration:none;display:inline-block}
  .btn.ghost{background:#fff;color:var(--red);border:1px solid #e3c9c7}
  .tick{margin:0 auto}
  .tick-circle{stroke-dasharray:195;stroke-dashoffset:195;animation:draw .55s ease-out .05s forwards}
  .tick-path{stroke-dasharray:48;stroke-dashoffset:48;animation:draw .38s ease-out .45s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  form.fade{animation:fade .28s ease forwards}
  @keyframes fade{to{opacity:0;transform:scale(.985)}}
  .name{font-weight:600}
</style>
</head>
<body>
<header>
  <b data-i18n="brand">張崑崙書院 · 投稿</b>
  <span class="sp"></span>
  <div class="lang">
    <button data-lang="zh-Hant">繁</button>
    <button data-lang="zh-Hans">简</button>
    <button data-lang="en">EN</button>
  </div>
</header>

<main>
  <h1 data-i18n="title">投稿到書院資料庫</h1>
  <p class="lead" data-i18n="lead">作品、工具、網站、文件都可以。提交後由書院審核，通過才公開。</p>

  <form id="form" class="card" novalidate>
    <div class="row">
      <div>
        <label data-i18n="kind">類型</label>
        <select id="kind">
          <option value="work" data-i18n="kindWork">院生作品（Skill / 工具 / 專案）</option>
          <option value="link" data-i18n="kindLink">網站或資源</option>
          <option value="doc" data-i18n="kindDoc">文件（規章、通知、表格）</option>
        </select>
      </div>
      <div>
        <label data-i18n="author">作者 / 提交人</label>
        <input type="text" id="author" data-i18n-ph="authorPh" placeholder="姓名或稱呼">
      </div>
    </div>

    <label data-i18n="titleLabel">標題</label>
    <input type="text" id="title" data-i18n-ph="titlePh" placeholder="一句話說清這是什麼" maxlength="80">

    <label data-i18n="noteLabel">說明（可選）</label>
    <textarea id="note" data-i18n-ph="notePh" placeholder="怎麼用、解決什麼問題、需要什麼環境"></textarea>

    <label data-i18n="contactLabel">聯絡方式（可選，公開與否由你決定）</label>
    <input type="text" id="contact" data-i18n-ph="contactPh" placeholder="電郵或其他，可不填">

    <label data-i18n="filesLabel">文件</label>
    <div class="drop" id="drop">
      <b data-i18n="dropMain">點擊選擇，或把文件拖到這裡</b>
      <span data-i18n="dropSub">PDF / PNG / JPG / WEBP / MD / ZIP，單個不超過 20 MB，最多 3 個</span>
    </div>
    <input type="file" id="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.md,.zip">
    <div class="files" id="files"></div>

    <label data-i18n="codeLabel">邀請碼</label>
    <input type="text" id="code" data-i18n-ph="codePh" placeholder="向書院索取" autocomplete="off">

    <div class="chk">
      <input type="checkbox" id="consent">
      <label for="consent" style="margin:0" data-i18n="consent">我確認有權分享這些內容，並同意書院在註明作者的前提下展示。</label>
    </div>

    <button class="btn" id="submit" type="submit" data-i18n="send">提交</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="done" id="done" aria-live="polite">
    <svg class="tick" viewBox="0 0 72 72" width="76" height="76">
      <circle class="tick-circle" cx="36" cy="36" r="31" fill="none" stroke="#1c7c54" stroke-width="4"/>
      <path class="tick-path" d="M21 37.5 L31 47.5 L52 26" fill="none" stroke="#1c7c54"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2 data-i18n="doneTitle">已收到</h2>
    <p class="ref"><span data-i18n="doneRef">編號</span> <b id="refNo">#—</b></p>
    <p class="doneNote" data-i18n="doneNote">審核通過後會公開；需要修改可以再交一份。</p>
    <div class="doneBtns">
      <button class="btn ghost" id="again" type="button" data-i18n="again">再交一份</button>
    </div>
  </div>

  <p class="foot" data-i18n="foot">提交不會立即上線；審核通過後才會出現在資料庫。</p>
</main>

<script>
/* 名字永遠用繁體，不參與翻譯 */
const NAME = { mascot: "崑崑", college: "張崑崙書院" };

const I18N = {
  "zh-Hant": {
    brand: `${NAME.college} · 投稿`,
    title: "投稿到書院資料庫",
    lead: "作品、工具、網站、文件都可以。提交後由書院審核，通過才公開。",
    kind: "類型", kindWork: "院生作品（Skill / 工具 / 專案）", kindLink: "網站或資源", kindDoc: "文件（規章、通知、表格）",
    author: "作者 / 提交人", authorPh: "姓名或稱呼",
    titleLabel: "標題", titlePh: "一句話說清這是什麼",
    noteLabel: "說明（可選）", notePh: "怎麼用、解決什麼問題、需要什麼環境",
    contactLabel: "聯絡方式（可選，公開與否由你決定）", contactPh: "電郵或其他，可不填",
    filesLabel: "文件", dropMain: "點擊選擇，或把文件拖到這裡",
    dropSub: `PDF / PNG / JPG / WEBP / MD / ZIP，單個不超過 20 MB，最多 3 個`,
    codeLabel: "邀請碼", codePh: "向書院索取",
    consent: "我確認有權分享這些內容，並同意書院在註明作者的前提下展示。",
    send: "提交", sending: "上傳中…", remove: "移除",
    ok: (id) => `已收到，編號 #${id}。審核通過後會公開，謝謝。`,
    errCode: "邀請碼不對。", errConsent: "請先勾選授權聲明。",
    errTitle: "標題至少要兩個字。", errFiles: "至少選一個文件。",
    errSize: "文件太大，單個上限 20 MB。", errType: "有不支援的文件類型。",
    errRate: "提交太頻繁，請一小時後再試。", errNet: "網路出錯，請稍後重試。",
    foot: "提交不會立即上線；審核通過後才會出現在資料庫。",
    doneTitle: "已收到", doneRef: "編號", doneNote: "審核通過後會公開；需要修改可以再交一份。", again: "再交一份",
    closed: "投稿暫未開放。"
  },
  "zh-Hans": {
    brand: `${NAME.college} · 投稿`,
    title: "投稿到书院数据库",
    lead: "作品、工具、网站、文件都可以。提交后由书院审核，通过才公开。",
    kind: "类型", kindWork: "院生作品（Skill / 工具 / 项目）", kindLink: "网站或资源", kindDoc: "文件（规章、通知、表格）",
    author: "作者 / 提交人", authorPh: "姓名或称呼",
    titleLabel: "标题", titlePh: "一句话说清这是什么",
    noteLabel: "说明（可选）", notePh: "怎么用、解决什么问题、需要什么环境",
    contactLabel: "联系方式（可选，公开与否由你决定）", contactPh: "邮箱或其他，可不填",
    filesLabel: "文件", dropMain: "点击选择，或把文件拖到这里",
    dropSub: "PDF / PNG / JPG / WEBP / MD / ZIP，单个不超过 20 MB，最多 3 个",
    codeLabel: "邀请码", codePh: "向书院索取",
    consent: "我确认有权分享这些内容，并同意书院在注明作者的前提下展示。",
    send: "提交", sending: "上传中…", remove: "移除",
    ok: (id) => `已收到，编号 #${id}。审核通过后会公开，谢谢。`,
    errCode: "邀请码不对。", errConsent: "请先勾选授权声明。",
    errTitle: "标题至少要两个字。", errFiles: "至少选一个文件。",
    errSize: "文件太大，单个上限 20 MB。", errType: "有不支持的文件类型。",
    errRate: "提交太频繁，请一小时后再试。", errNet: "网络出错，请稍后重试。",
    foot: "提交不会立即上线；审核通过后才会出现在数据库。",
    doneTitle: "已收到", doneRef: "编号", doneNote: "审核通过后会公开；需要修改可以再交一份。", again: "再交一份",
    closed: "投稿暂未开放。"
  },
  en: {
    brand: `${NAME.college} · Submit`,
    title: "Submit to the college database",
    lead: "Projects, tools, websites and documents are all welcome. Everything is reviewed before it goes live.",
    kind: "Type", kindWork: "Student work (skill / tool / project)", kindLink: "Website or resource", kindDoc: "Document (rules, notice, form)",
    author: "Author", authorPh: "Your name or handle",
    titleLabel: "Title", titlePh: "One line: what is this?",
    noteLabel: "Description (optional)", notePh: "How to use it, what problem it solves, requirements",
    contactLabel: "Contact (optional, you decide if public)", contactPh: "Email or other, optional",
    filesLabel: "Files", dropMain: "Click to choose, or drop files here",
    dropSub: "PDF / PNG / JPG / WEBP / MD / ZIP, up to 20 MB each, max 3",
    codeLabel: "Invite code", codePh: "Ask the college",
    consent: "I confirm I have the right to share this, and agree to the college showing it with attribution.",
    send: "Submit", sending: "Uploading…", remove: "Remove",
    ok: (id) => `Received, reference #${id}. It will appear once reviewed.`,
    errCode: "Invite code is wrong.", errConsent: "Please tick the consent box.",
    errTitle: "Title is too short.", errFiles: "Choose at least one file.",
    errSize: "File too large (20 MB each).", errType: "Unsupported file type.",
    errRate: "Too many submissions, try again later.", errNet: "Network error, please retry.",
    foot: "Nothing goes live immediately; it appears after review.",
    doneTitle: "Received", doneRef: "Reference", doneNote: "It goes live after review. You can submit an updated copy anytime.", again: "Submit another",
    closed: "Submissions are not open yet."
  }
};

const LANG_KEY = "cklc_upload_lang";
let lang = localStorage.getItem(LANG_KEY) || "zh-Hant";   // 站点默认繁体，用户切换后记住
if (!I18N[lang]) lang = "zh-Hant";

const $ = (s) => document.querySelector(s);
const t = (k) => I18N[lang][k];

function paint() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = t(el.dataset.i18n);
    if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    el.placeholder = t(el.dataset.i18nPh) || "";
  });
  document.querySelectorAll(".lang button").forEach((b) =>
    b.classList.toggle("on", b.dataset.lang === lang));
  document.title = `${t("brand")}`;
}

document.querySelectorAll(".lang button").forEach((b) => b.onclick = () => {
  lang = b.dataset.lang; localStorage.setItem(LANG_KEY, lang); function showDone(id) {
  const form = $("#form"), done = $("#done");
  form.classList.add("fade");
  setTimeout(() => {
    form.style.display = "none";
    form.classList.remove("fade");
    $("#refNo").textContent = "#" + id;
    done.classList.add("show");
    done.scrollIntoView({ block: "center", behavior: "smooth" });
  }, 260);
}

$("#again").onclick = () => {
  const form = $("#form"), done = $("#done");
  done.classList.remove("show");
  form.reset(); picked = []; renderFiles();
  form.style.display = "";
  msg.className = "msg"; msg.textContent = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

paint();
});

/* ── 选文件 ─────────────────────────── */
let picked = [];
const drop = $("#drop"), fileInput = $("#file"), list = $("#files");
const MAX_MB = 20, MAX_N = 3;
const OK_EXT = [".pdf", ".png", ".jpg", ".jpeg", ".webp", ".md", ".zip"];

function human(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}

function renderFiles() {
  list.innerHTML = picked.map((f, i) => `
    <div class="f"><span>${f.name}</span><i>${human(f.size)}</i>
    <button type="button" data-i="${i}">${t("remove")}</button></div>`).join("");
  list.querySelectorAll("button").forEach((b) => b.onclick = () => {
    picked.splice(+b.dataset.i, 1); renderFiles();
  });
}

function addFiles(files) {
  for (const f of files) {
    if (picked.length >= MAX_N) break;
    const ext = f.name.slice(f.name.lastIndexOf(".")).toLowerCase();
    if (!OK_EXT.includes(ext) || f.size > MAX_MB * 1048576) { show("errType"); continue; }
    if (!picked.some((x) => x.name === f.name && x.size === f.size)) picked.push(f);
  }
  renderFiles();
}

drop.onclick = () => fileInput.click();
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ""; };
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.add("hot");
}));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.remove("hot");
}));
drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

/* ── 提交 ───────────────────────────── */
const msg = $("#msg");
function show(kind, text) {
  msg.className = "msg " + kind;
  msg.textContent = text;
  msg.scrollIntoView({ block: "center", behavior: "smooth" });
}

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const title = $("#title").value.trim();
  if (title.length < 2) return show("err", t("errTitle"));
  if (!picked.length) return show("err", t("errFiles"));
  if (!$("#consent").checked) return show("err", t("errConsent"));

  const fd = new FormData();
  fd.append("code", $("#code").value.trim());
  fd.append("kind", $("#kind").value);
  fd.append("title", title);
  fd.append("author", $("#author").value.trim());
  fd.append("contact", $("#contact").value.trim());
  fd.append("note", $("#note").value.trim());
  fd.append("consent", "1");
  picked.forEach((f) => fd.append("files", f, f.name));

  const btn = $("#submit");
  btn.disabled = true; btn.textContent = t("sending");
  try {
    const r = await fetch("api/upload", { method: "POST", body: fd });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      showDone(d.id);
    } else {
      const map = { 403: "errCode", 400: "errTitle", 413: "errSize", 415: "errType", 429: "errRate", 503: "closed" };
      show("err", t(map[r.status] || "errNet") + (d.detail ? `（${d.detail}）` : ""));
    }
  } catch (_) {
    show("err", t("errNet"));
  } finally {
    btn.disabled = false; btn.textContent = t("send");
  }
};

function showDone(id) {
  const form = $("#form"), done = $("#done");
  form.classList.add("fade");
  setTimeout(() => {
    form.style.display = "none";
    form.classList.remove("fade");
    $("#refNo").textContent = "#" + id;
    done.classList.add("show");
    done.scrollIntoView({ block: "center", behavior: "smooth" });
  }, 260);
}

$("#again").onclick = () => {
  const form = $("#form"), done = $("#done");
  done.classList.remove("show");
  form.reset(); picked = []; renderFiles();
  form.style.display = "";
  msg.className = "msg"; msg.textContent = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

paint();
fetch("api/upload/info").then((r) => r.json()).then((d) => {
  if (!d.open) show("err", t("closed"));
}).catch(() => {});
</script>
</body>
</html>
