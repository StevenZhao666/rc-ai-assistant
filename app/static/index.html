<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>崑崑 · 張崑崙書院助手</title>
<link rel="icon" href="img/kunkun.jpg">
<style>
  :root{
    --bg:#f7f2f1; --panel:#ffffff; --line:#e6d8d6; --ink:#241a19; --dim:#7a6866;
    --red:#88070f; --red-dark:#690e0e; --red-soft:#f3dedd; --ok:#2f6b4f; --warn:#9a6700;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.7 -apple-system,"Segoe UI","Microsoft JhengHei","Microsoft YaHei",sans-serif;}
  header{position:sticky;top:0;z-index:6;background:var(--red);color:#fff;
         border-bottom:1px solid var(--red-dark);
         padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;color:#fff}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;
        border:1px solid rgba(255,255,255,.32);color:#fff;opacity:.92}
  .pill.btn{cursor:pointer;opacity:1}
  .pill.btn:hover{border-color:#fff;background:rgba(255,255,255,.14)}
  .lang{margin-left:auto;display:flex;gap:4px}
  .lang button{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;
               background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
  .lang button.on{background:#fff;color:var(--red);border-color:#fff;font-weight:600}
  main{max-width:840px;margin:0 auto;padding:24px 20px 150px}
  .notice{margin:12px auto 0;max-width:840px;padding:8px 12px;border:1px solid #e4c9c7;
          background:#fff7f6;color:#6b2b2b;border-radius:8px;font-size:12.5px;line-height:1.7}
  .notice b{color:var(--red)}
  .msg{margin:18px 0;display:flex;gap:10px}
  .msg .who{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;
            font-size:12px;font-weight:600;background:var(--red);color:#fff;overflow:hidden}
  .msg.ai .who{background:#fff;border:1px solid var(--line);padding:0}
  .msg.ai .who img{width:100%;height:100%;object-fit:cover}
  .msg.user .who{background:#e9d3d1;color:#6b2b2b}
  .bubble{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:12px 16px;white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:#fdf4f3;border-color:#e3c9c7}
  .cite{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--dim)}
  .cite b{color:var(--ink);font-weight:600}
  .tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;margin:4px 6px 0 0;
       background:#fff4d6;color:var(--warn);border:1px solid #ecd9a6}
  .fail{border-color:#e0b4b1}
  .fb{display:flex;gap:8px;align-items:center;margin-top:10px}
  .fb button{background:#fff;border:1px solid var(--line);color:var(--dim);
             font-size:12.5px;padding:3px 10px;border-radius:8px;cursor:pointer;font-weight:500}
  .fb button:hover{border-color:var(--red);color:var(--red)}
  .fb .done{font-size:12.5px;color:var(--ok)}
  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);
         border-top:1px solid var(--line);padding:14px 20px}
  .box{max-width:840px;margin:0 auto;display:flex;gap:10px}
  input[type=text]{flex:1;background:#fff;border:1px solid var(--line);color:var(--ink);
                   border-radius:10px;padding:11px 14px;font:inherit;outline:none}
  input[type=text]:focus{border-color:var(--red)}
  button.primary{background:var(--red);color:#fff;border:0;border-radius:10px;padding:0 20px;
                 font:inherit;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.5;cursor:default}
  .quick{max-width:840px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap}
  .quick span{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;
              color:var(--dim);cursor:pointer;background:#fff}
  .quick span:hover{border-color:var(--red);color:var(--red)}
  /* 学号弹窗 */
  .mask{position:fixed;inset:0;background:rgba(36,26,25,.45);display:grid;place-items:center;
        z-index:20;padding:20px}
  .mask[hidden]{display:none}   /* 关键：没有这条，hidden 属性会被 .mask 的 display:grid 盖掉 */
  .sheet{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:380px;
         box-shadow:0 18px 50px rgba(0,0,0,.18)}
  .sheet h2{margin:0 0 6px;font-size:17px;color:var(--red)}
  .sheet p{margin:0 0 14px;font-size:13px;color:var(--dim);line-height:1.6}
  .sheet input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
               font:inherit;outline:none}
  .sheet input:focus{border-color:var(--red)}
  .sheet .row{display:flex;gap:10px;margin-top:14px}
  .sheet .row button{flex:1;padding:10px 0}
  .sheet .ghost{background:#fff;border:1px solid var(--line);color:var(--dim);
                border-radius:10px;font:inherit;cursor:pointer}
  .sheet .err{color:#b42318;font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">崑崑 · 張崑崙書院助手</h1>
  <span class="pill btn" id="who" title="填寫學號">未填學號</span>
  <span class="pill" id="badge1">測試版 · 資料未審核</span>
  <span class="pill" id="badge2">AI 生成 · 僅供參考</span>
  <span class="lang">
    <button data-lang="zh-Hant" class="on">繁</button>
    <button data-lang="zh-Hans">简</button>
    <button data-lang="en">EN</button>
  </span>
</header>

<div class="notice" id="notice"></div>

<main id="log"></main>

<footer>
  <div class="quick" id="quick"></div>
  <div class="box">
    <input id="q" type="text" autocomplete="off">
    <button class="primary" id="send"></button>
  </div>
</footer>

<div class="mask" id="mask" hidden>
  <div class="sheet">
    <h2 id="mTitle"></h2>
    <p id="mHint"></p>
    <input id="sidInput" type="text" maxlength="7" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="err" id="sidErr" hidden></div>
    <div class="row">
      <button class="primary" id="sidOk"></button>
      <button class="ghost" id="sidSkip"></button>
    </div>
  </div>
</div>

<script>
/* ── 文案（三语） ─────────────────────────────── */
const T = {
  "zh-Hant": {
    title: "崑崑 · 張崑崙書院助手",
    badge1: "測試版 · 資料未審核",
    badge2: "AI 生成 · 僅供參考",
    whoNone: "未填學號（點此填寫）",
    whoHave: "學號：",
    notice: "回答由 AI 根據書院資料自動生成，<b>僅供參考，不代表書院或學校的正式意見</b>，也不能作為決定依據。涉及規定、費用、期限，請以官方最新公告和書院辦公室答覆為準；緊急情況請撥 <b>999</b>。",
    welcome: "你好，我是崑崑，張崑崙書院的吉祥物。書院的事都可以問我——規章、設施、房務、辦事流程。\n我只根據書院資料回答，答完會告訴你依據哪一條。\n\n注意：我的回答是 AI 自動生成的，僅供參考；遇到規定、費用、期限這類事，請以官方公告為準。",
    placeholder: "問點什麼… 例如：退宿要提前多久預約？",
    send: "發送",
    quick: ["辦公室在哪", "怎麼換房間", "健身房時間", "能養寵物嗎", "問一個資料裡沒有的"],
    quickQ: ["書院辦公室在哪裡？", "房間更換怎麼申請？", "健身房開放時間", "可以養寵物嗎", "今天晚飯吃什麼"],
    useful: "👍 有用", useless: "👎 沒用", thanks: "感謝回饋 ✓",
    fbFail: "記錄失敗，可能沒網，再試一次",
    idTitle: "填一下學號",
    idHint: "學號只用於統計「誰問了什麼」和限制每人每小時的額度，不會公開，也不需要密碼。",
    idOk: "確定", idSkip: "稍後再說",
    idErr: "學號填 7 位：2 個字母 + 5 位數字，例如 uc12345",
    askFirst: "先點右上角填學號",
    searching: "檢索中…",
    tooMany: "這個小時問得太多了，過一會兒再來。",
    quotaTip: "本小時的 AI 回答次數用完了，後面會改為直接摘錄資料原文。",
    reqFail: "請求失敗：",
    cite: "依據", verified: "核實於", unverified: "未核實", matched: "匹配條目："
  },
  "zh-Hans": {
    title: "昆昆 · 张昆仑书院助手",
    badge1: "测试版 · 数据未审核",
    badge2: "AI 生成 · 仅供参考",
    whoNone: "未填学号（点此填写）",
    whoHave: "学号：",
    notice: "回答由 AI 根据书院资料自动生成，<b>仅供参考，不代表书院或学校的正式意见</b>，也不能作为决定依据。涉及规定、费用、期限，请以官方最新公告和书院办公室答复为准；紧急情况请拨 <b>999</b>。",
    welcome: "你好，我是昆昆，张昆仑书院的吉祥物。书院的事都可以问我——规章、设施、房务、办事流程。\n我只根据书院资料回答，答完会告诉你依据哪一条。\n\n注意：我的回答是 AI 自动生成的，仅供参考；遇到规定、费用、期限这类事，请以官方公告为准。",
    placeholder: "问点什么… 例如：退宿要提前多久预约？",
    send: "发送",
    quick: ["办公室在哪", "怎么换房间", "健身房时间", "能养宠物吗", "问一个资料里没有的"],
    quickQ: ["书院办公室在哪里？", "房间更换怎么申请？", "健身房开放时间", "可以养宠物吗", "今天晚饭吃什么"],
    useful: "👍 有用", useless: "👎 没用", thanks: "感谢反馈 ✓",
    fbFail: "记录失败，可能没网，再试一次",
    idTitle: "填一下学号",
    idHint: "学号只用于统计「谁问了什么」和限制每人每小时的额度，不会公开，也不需要密码。",
    idOk: "确定", idSkip: "稍后再说",
    idErr: "学号填 7 位：2 个字母 + 5 位数字，例如 uc12345",
    askFirst: "先点右上角填学号",
    searching: "检索中…",
    tooMany: "这个小时问得太多了，过一会儿再来。",
    quotaTip: "本小时的 AI 回答次数用完了，后面会改为直接摘录资料原文。",
    reqFail: "请求失败：",
    cite: "依据", verified: "核实于", unverified: "未核实", matched: "匹配条目："
  },
  "en": {
    title: "Kunkun · CKLC Assistant",
    badge1: "Test build · data unreviewed",
    badge2: "AI-generated · reference only",
    whoNone: "Enter student ID",
    whoHave: "ID: ",
    notice: "Answers are generated by AI from college materials, <b>for reference only</b> — not an official statement of the College or the University. For rules, fees and deadlines, follow the latest official notice or ask the College Office. In an emergency call <b>999</b>.",
    welcome: "Hi, I'm Kunkun, the mascot of Cheong Kun Lun College. Ask me about hall rules, facilities, rooms and procedures.\nI answer only from college materials and show the source.\n\nAnswers are AI-generated; for rules, fees and deadlines follow official notices.",
    placeholder: "Ask something… e.g. how many days ahead for check-out?",
    send: "Send",
    quick: ["Where's the office", "Change rooms", "Gym hours", "Pets allowed?", "Ask something unknown"],
    quickQ: ["Where is the college office?", "How do I change rooms?", "Gym opening hours", "Can I keep a pet?", "What's for dinner tonight"],
    useful: "👍 Helpful", useless: "👎 Not helpful", thanks: "Thanks for the feedback ✓",
    fbFail: "Couldn't save, check your connection and retry",
    idTitle: "Your student ID",
    idHint: "Used only to count questions and apply the hourly quota. Not published, no password involved.",
    idOk: "OK", idSkip: "Later",
    idErr: "7 characters: 2 letters + 5 digits, e.g. uc12345",
    askFirst: "Enter your student ID first",
    searching: "Searching…",
    tooMany: "Too many questions this hour. Try again later.",
    quotaTip: "Hourly AI quota used up — falling back to quoting the source text.",
    reqFail: "Request failed: ",
    cite: "Source", verified: "verified", unverified: "unverified", matched: "Matched entry: "
  }
};

const SID_KEY = 'cklc_sid';
const DEV_KEY = 'cklc_dev';
const LANG_KEY = 'cklc_lang';

const S = {
  lang: localStorage.getItem(LANG_KEY) || 'zh-Hant',
  sid: localStorage.getItem(SID_KEY) || ''
};
if (!T[S.lang]) S.lang = 'zh-Hant';
const t = k => T[S.lang][k];

/* ── 设备号 ───────────────────────────────────── */
function devId() {
  let d = localStorage.getItem(DEV_KEY);
  if (!d) {
    d = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random()));
    localStorage.setItem(DEV_KEY, d);
  }
  return d;
}
function headers() {
  const h = {'Content-Type': 'application/json', 'X-Device-Id': devId()};
  if (S.sid) h['X-Student-Id'] = S.sid;
  return h;
}

/* ── 界面文字 ─────────────────────────────────── */
const $ = s => document.querySelector(s);
const log = $('#log'), qEl = $('#q'), sendBtn = $('#send'), whoEl = $('#who');

function paintChrome() {
  document.documentElement.lang = S.lang;
  document.title = t('title');
  $('#hTitle').textContent = t('title');
  $('#badge1').textContent = t('badge1');
  $('#badge2').textContent = t('badge2');
  $('#notice').innerHTML = t('notice');
  qEl.placeholder = t('placeholder');
  sendBtn.textContent = t('send');
  whoEl.textContent = S.sid ? (t('whoHave') + S.sid) : t('whoNone');
  document.querySelectorAll('.lang button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === S.lang));

  const quick = $('#quick');
  quick.innerHTML = '';
  t('quick').forEach((label, i) => {
    const s = document.createElement('span');
    s.textContent = label;
    s.onclick = () => ask(t('quickQ')[i]);
    quick.appendChild(s);
  });

  if (!log.dataset.welcomed) {
    log.innerHTML = '';
    addMsg('ai', t('welcome'));
    log.dataset.welcomed = '1';
  }
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  S.lang = b.dataset.lang;
  localStorage.setItem(LANG_KEY, S.lang);
  paintChrome();
});

/* ── 学号弹窗 ─────────────────────────────────── */
const mask = $('#mask');

function openSidModal() {
  $('#mTitle').textContent = t('idTitle');
  $('#mHint').textContent = t('idHint');
  $('#sidOk').textContent = t('idOk');
  $('#sidSkip').textContent = t('idSkip');
  $('#sidErr').hidden = true;
  $('#sidInput').value = S.sid;
  mask.hidden = false;
  setTimeout(() => $('#sidInput').focus(), 30);
}

function closeSidModal() { mask.hidden = true; }

$('#sidOk').onclick = () => {
  const v = $('#sidInput').value.trim();
  if (!/^[A-Za-z]{2}\d{5}$/.test(v)) {
    $('#sidErr').textContent = t('idErr');
    $('#sidErr').hidden = false;
    return;
  }
  S.sid = v.toLowerCase();
  localStorage.setItem(SID_KEY, S.sid);
  closeSidModal();
  paintChrome();
};
$('#sidSkip').onclick = closeSidModal;
$('#sidInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#sidOk').click(); });
whoEl.onclick = openSidModal;

/* ── 消息 ─────────────────────────────────────── */
function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const face = role === 'user'
    ? `<span>${S.lang === 'en' ? 'You' : '我'}</span>`
    : `<img src="img/kunkun.jpg" alt="昆昆">`;
  el.innerHTML = `<div class="who">${face}</div><div class="bubble"></div>`;
  el.querySelector('.bubble').textContent = text;
  log.appendChild(el);
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
  return el.querySelector('.bubble');
}

function renderCitations(bubble, cites) {
  if (!cites || !cites.length) return;
  const box = document.createElement('div');
  box.className = 'cite';
  cites.forEach((c, i) => {
    const d = document.createElement('div');
    d.style.marginTop = i ? '8px' : '0';
    d.innerHTML = `<b>${t('cite')} ${i+1}：</b>${c.source || '—'}`
      + `（${c.verified_at ? t('verified') + ' ' + c.verified_at : t('unverified')}）`
      + `<div style="margin-top:2px">${t('matched')}${c.question}</div>`;
    (c.warnings || []).forEach(w => {
      const sp = document.createElement('span');
      sp.className = 'tag'; sp.textContent = '⚠ ' + w;
      d.appendChild(sp);
    });
    box.appendChild(d);
  });
  bubble.appendChild(box);
}

async function sendFeedback(q, ans, mode, vote, note) {
  try {
    const r = await fetch('api/feedback', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({question: q, answer: ans, vote, note: note || '', mode: mode || ''})
    });
    return r.ok;
  } catch (e) { return false; }
}

function addFeedback(bubble, q, ans, mode) {
  const row = document.createElement('div');
  row.className = 'fb';
  row.innerHTML = `<button>${t('useful')}</button><button>${t('useless')}</button>`;
  const [up, down] = row.querySelectorAll('button');
  let voted = false;

  const submit = async (vote, btn) => {
    if (voted) return;
    let note = '';
    if (vote === -1) {
      const why = S.lang === 'en' ? 'What was wrong? (optional)'
                : (S.lang === 'zh-Hans' ? '哪里不对？（可以不填）' : '哪裡不對？（可以不填）');
      const n = prompt(why, '');
      if (n === null) return;
      note = n.trim();
    }
    voted = true;
    const ok = await sendFeedback(q, ans, mode, vote, note);
    if (ok) {
      row.innerHTML = `<span class="done">${t('thanks')}</span>`;
    } else {
      voted = false;
      const tip = document.createElement('span');
      tip.className = 'done'; tip.style.color = 'var(--warn)'; tip.textContent = t('fbFail');
      row.appendChild(tip);
    }
  };

  up.onclick = () => submit(1, up);
  down.onclick = () => submit(-1, down);
  bubble.appendChild(row);
}

/* ── 提问 ─────────────────────────────────────── */
async function ask(text) {
  if (!text.trim()) return;
  addMsg('user', text);
  qEl.value = '';
  sendBtn.disabled = true;
  const b = addMsg('ai', t('searching'));
  try {
    const r = await fetch('api/ask', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({question: text})
    });
    if (r.status === 429) {
      const e = await r.json();
      b.textContent = e.detail || t('tooMany');
      return;
    }
    const data = await r.json();
    b.textContent = data.answer || JSON.stringify(data);
    if ((data.mode || '').startsWith('fallback')) b.classList.add('fail');
    renderCitations(b, data.citations);
    addFeedback(b, text, b.textContent, data.mode);
    if (data.quota && data.quota.llm_left === 0) {
      const tip = document.createElement('div');
      tip.className = 'cite';
      tip.textContent = t('quotaTip');
      b.appendChild(tip);
    }
  } catch (e) {
    b.textContent = t('reqFail') + e;
  } finally {
    sendBtn.disabled = false;
    qEl.focus();
  }
}

sendBtn.onclick = () => ask(qEl.value);
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') ask(qEl.value); });

/* ── 启动 ─────────────────────────────────────── */
paintChrome();
if (!S.sid) openSidModal();
(async () => {
  try {
    const me = await (await fetch('api/me', {headers: headers()})).json();
    if (!S.sid && me.student_id && me.student_id !== 'UC000000') {
      S.sid = me.student_id; localStorage.setItem(SID_KEY, S.sid); paintChrome();
    }
  } catch (e) { /* 忽略 */ }
})();
qEl.focus();
</script>
</body>
</html>
